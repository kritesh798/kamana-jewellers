services:
  - type: web
    name: kamana-jewellers
    runtime: node
    plan: 0.5c-512mb
    buildCommand: npm install
    startCommand: npm start
    disk:
      name: kamana-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DB_PATH
        value: /var/data/kamana.db
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
