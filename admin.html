<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><link rel="stylesheet" href="styles.css"><title>Admin | New Kamana Jewellers</title></head><body>
<header class="top"><a class="brand" href="/">New Kamana Jewellers: admin</a><div class="admin-actions"><a href="/">Shop</a><button class="btn ghost" id="out" type="button" hidden>Sign out</button></div></header>
<main class="panel"><div id="login"><h1>Admin sign in</h1><form id="loginForm"><label>Email<input name="email" type="email" required autocomplete="username"></label><label>Password<input name="password" type="password" required autocomplete="current-password"></label><button class="btn call">Sign in</button></form></div>
<p class="err" id="err" role="alert"></p><div id="app" hidden>
<h2>Today's rate (NPR per tola)</h2><p class="note">Hallmark gold and silver are refreshed daily at 12:00 Nepal time from the Federation of Nepal Gold and Silver Dealers’ Association. Manual values may be replaced at the next update.</p><form id="rateForm"><div class="row"><label>Hallmark gold<input name="hallmark_gold" type="number" min="0" step="any"></label><label>Tejabi gold (leave empty if not quoted)<input name="tejabi_gold" type="number" min="0" step="any"></label><label>Silver<input name="silver" type="number" min="0" step="any"></label><label>Nepali date (optional)<input name="updated_bs"></label></div><button class="btn wa">Save today's rate</button> <span id="rateMsg"></span></form>
<h2>Requests</h2><table class="tbl" id="reqs"></table>
<h2>Products</h2><form id="pf"><input type="hidden" name="id"><div class="row"><label>Name<input name="name" required></label><label>Category<select name="category" id="cat"></select></label><label>Metal<input name="metal" placeholder="Gold or Silver"></label><label>Purity (optional)<input name="purity"></label><label>Weight in tola (optional)<input name="weight_tola" type="number" min="0" step="any"></label><label>Price (empty means Price on request)<input name="price"></label><label>Image path<input name="image" placeholder="assets/photos/ring-1.webp"></label><label>Photo description (alt text)<input name="alt"></label></div><button class="btn wa">Save product</button> <button class="btn ghost" type="reset" id="pr">Clear</button></form>
<table class="tbl" id="prods"></table>
<h2>Admin accounts</h2><table class="tbl" id="users"></table></div></main><script src="admin.js"></script></body></html>
